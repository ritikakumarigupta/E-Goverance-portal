<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133E87" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Icon Container (Bridge / Gateway + Ashoka Chakra motif) -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Base Gateway/Bridge Pillars -->
    <path d="M 8 78 L 8 40 C 8 20, 26 6, 47 6 C 68 6, 86 20, 86 40 L 86 78 Z" fill="#F0F4F8" stroke="#133E87" stroke-width="2.5"/>
    
    <!-- Top Tricolor Arches (Setu / Bridge) -->
    <!-- Saffron Top Arch -->
    <path d="M 12 36 C 20 18, 33 12, 47 12 C 61 12, 74 18, 82 36" fill="none" stroke="url(#saffronGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- White Middle Arch -->
    <path d="M 17 44 C 24 30, 35 24, 47 24 C 59 24, 70 30, 77 44" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Green Inner Arch -->
    <path d="M 23 52 C 29 41, 38 36, 47 36 C 56 36, 65 41, 71 52" fill="none" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Dharma Chakra (24 spokes simplified) -->
    <g transform="translate(47, 56)">
      <circle r="14" fill="#FFFFFF" stroke="#002B5B" stroke-width="2.5"/>
      <circle r="3.5" fill="#002B5B"/>
      <!-- Spokes -->
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#002B5B" stroke-width="1.2"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#002B5B" stroke-width="1.2"/>
      <line x1="-9.9" y1="-9.9" x2="9.9" y2="9.9" stroke="#002B5B" stroke-width="1.2"/>
      <line x1="9.9" y1="-9.9" x2="-9.9" y2="9.9" stroke="#002B5B" stroke-width="1.2"/>
      <line x1="-5.3" y1="-13" x2="5.3" y2="13" stroke="#002B5B" stroke-width="0.9"/>
      <line x1="5.3" y1="-13" x2="-5.3" y2="13" stroke="#002B5B" stroke-width="0.9"/>
      <line x1="-13" y1="-5.3" x2="13" y2="5.3" stroke="#002B5B" stroke-width="0.9"/>
      <line x1="-13" y1="5.3" x2="13" y2="-5.3" stroke="#002B5B" stroke-width="0.9"/>
    </g>

    <!-- Base Foundation bar -->
    <rect x="4" y="78" width="86" height="7" rx="3.5" fill="#0B2545"/>
    <rect x="24" y="86" width="46" height="3" rx="1.5" fill="url(#saffronGrad)"/>
  </g>

  <!-- Typography: SevaSetu -->
  <!-- "Seva" in Deep Navy Blue -->
  <text x="115" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Inter', sans-serif" font-size="44" font-weight="800" fill="#0B2545" letter-spacing="-0.5">Seva<tspan fill="#FF671F">Setu</tspan></text>
  
  <!-- Digital Dot Accent -->
  <circle cx="318" cy="32" r="4.5" fill="#138808"/>
  
  <!-- Tagline / Subtitle -->
  <text x="116" y="80" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#5A6A80" letter-spacing="1.5">NATIONAL E-GOVERNANCE GATEWAY</text>
  
  <rect x="116" y="88" width="280" height="2" fill="url(#saffronGrad)" rx="1"/>
</svg>

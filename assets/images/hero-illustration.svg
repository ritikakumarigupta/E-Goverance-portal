<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0B2545" flood-opacity="0.12" />
    </filter>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2545" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Decorative Circles -->
  <circle cx="300" cy="250" r="210" fill="#F1F5F9" opacity="0.8"/>
  <circle cx="450" cy="120" r="80" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="120" cy="380" r="90" fill="#DCFCE7" opacity="0.6"/>

  <!-- Connecting Grid Lines (Digital Network) -->
  <path d="M 150 180 L 300 120 L 450 160 L 480 320 L 320 420 L 140 340 Z" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="150" cy="180" r="5" fill="#3B82F6"/>
  <circle cx="300" cy="120" r="5" fill="#FF9933"/>
  <circle cx="450" cy="160" r="5" fill="#22C55E"/>
  <circle cx="480" cy="320" r="5" fill="#3B82F6"/>
  <circle cx="320" cy="420" r="5" fill="#FF9933"/>
  <circle cx="140" cy="340" r="5" fill="#22C55E"/>

  <!-- Main Central Portal Screen / Laptop View -->
  <g transform="translate(120, 110)" filter="url(#cardShadow)">
    <!-- Base Display Frame -->
    <rect x="0" y="0" width="360" height="240" rx="16" fill="#0B2545"/>
    <!-- Screen Bezel Interior -->
    <rect x="8" y="8" width="344" height="224" rx="10" fill="url(#screenGrad)"/>
    
    <!-- Portal Header Bar inside Screen -->
    <rect x="8" y="8" width="344" height="34" rx="10" fill="#133E87"/>
    <!-- Window controls -->
    <circle cx="26" cy="25" r="4" fill="#EF4444"/>
    <circle cx="38" cy="25" r="4" fill="#F59E0B"/>
    <circle cx="50" cy="25" r="4" fill="#10B981"/>
    
    <!-- Mini Logo inside header -->
    <rect x="68" y="19" width="50" height="12" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="250" y="18" width="88" height="14" rx="4" fill="#FF9933"/>

    <!-- Screen Content: Service Cards Grid inside portal -->
    <!-- Service 1 (Identity) -->
    <rect x="24" y="58" width="94" height="68" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="42" cy="76" r="10" fill="#3B82F6"/>
    <path d="M 38 76 L 41 79 L 47 73" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <rect x="34" y="94" width="74" height="6" rx="3" fill="#1E3A8A"/>
    <rect x="34" y="105" width="50" height="5" rx="2.5" fill="#94A3B8"/>

    <!-- Service 2 (Certificate) -->
    <rect x="133" y="58" width="94" height="68" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <circle cx="151" cy="76" r="10" fill="#EA580C"/>
    <rect x="146" y="71" width="10" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="143" y="94" width="74" height="6" rx="3" fill="#9A3412"/>
    <rect x="143" y="105" width="54" height="5" rx="2.5" fill="#94A3B8"/>

    <!-- Service 3 (Welfare Schemes) -->
    <rect x="242" y="58" width="94" height="68" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <circle cx="260" cy="76" r="10" fill="#16A34A"/>
    <circle cx="260" cy="76" r="5" fill="#FFFFFF"/>
    <rect x="252" y="94" width="74" height="6" rx="3" fill="#14532D"/>
    <rect x="252" y="105" width="48" height="5" rx="2.5" fill="#94A3B8"/>

    <!-- Bottom Dashboard Row -->
    <rect x="24" y="142" width="190" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="36" y="154" width="80" height="8" rx="4" fill="#0F172A"/>
    <rect x="36" y="170" width="166" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="36" y="184" width="130" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="36" y="198" width="60" height="10" rx="4" fill="#138808"/>

    <!-- Mini Progress Chart -->
    <rect x="224" y="142" width="112" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="238" y="180" width="14" height="24" rx="3" fill="#93C5FD"/>
    <rect x="258" y="166" width="14" height="38" rx="3" fill="#3B82F6"/>
    <rect x="278" y="154" width="14" height="50" rx="3" fill="#FF9933"/>
    <rect x="298" y="160" width="14" height="44" rx="3" fill="#22C55E"/>

    <!-- Laptop Stand / Base -->
    <path d="M 100 240 L 260 240 L 280 252 L 80 252 Z" fill="#CBD5E1"/>
    <rect x="150" y="246" width="60" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Floating Badge 1: Instant e-Verification (Top Left) -->
  <g transform="translate(45, 60)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="170" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="28" r="16" fill="url(#greenGrad)"/>
    <path d="M 22 28 L 26 32 L 34 23" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0B2545">Verified E-Services</text>
    <text x="52" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#16A34A">100% Paperless</text>
  </g>

  <!-- Floating Badge 2: Secure Citizen ID (Top Right) -->
  <g transform="translate(400, 70)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="165" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="28" r="16" fill="url(#primaryGrad)"/>
    <!-- Lock / Security Icon -->
    <rect x="22" y="26" width="12" height="10" rx="2" fill="#FFFFFF"/>
    <path d="M 24 26 L 24 22 C 24 19 32 19 32 22 L 32 26" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0B2545">Aadhaar & DigiLocker</text>
    <text x="52" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#2563EB">256-Bit Encrypted</text>
  </g>

  <!-- Floating Badge 3: 24x7 Direct Benefit Transfer (Bottom Right) -->
  <g transform="translate(380, 360)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="185" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="30" cy="30" r="18" fill="url(#accentGrad)"/>
    <!-- Rupee symbol / Fast transfer icon -->
    <text x="25" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">₹</text>
    <text x="56" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0B2545">Direct Benefit (DBT)</text>
    <text x="56" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#EA580C">Instant Bank Transfer</text>
  </g>

  <!-- Floating Badge 4: Citizen Rating / Trust (Bottom Left) -->
  <g transform="translate(60, 350)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="160" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="28" r="16" fill="#FEF3C7"/>
    <polygon points="28,18 31,25 38,25 32,29 34,36 28,32 22,36 24,29 18,25 25,25" fill="#F59E0B"/>
    <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0B2545">Citizens Served</text>
    <text x="52" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#D97706">5 Crore + Happy Users</text>
  </g>
</svg>
